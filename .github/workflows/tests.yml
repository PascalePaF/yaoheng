name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: 'python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: -r requirements.txt'
      - name: Verify dependencies
        run: python -m pip check
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in (git ls-files -- "*.ps1")) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if ($parseErrors.Count) {
              Write-Error "PowerShell syntax failed: $script"
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }
      - name: Check Python syntax
        shell: pwsh
        run: |
          $pythonFiles = git ls-files -- "*.py"
          python -B -m py_compile $pythonFiles
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
